<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACE CLOUD — تجربة مشغل الميديا</title>
  <link rel="icon" type="image/jpeg" href="/assets/ace-cloud-logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg:#07090f; --surface:#0d1119; --surface-2:#131a26; --surface-3:#192333; --line:rgba(148,163,184,.13); --text:#e6edf7; --muted:#8290a5; --accent:#5eead4; --accent-2:#818cf8; --grad:linear-gradient(135deg,#5eead4 0%,#818cf8 100%); --ease:cubic-bezier(.2,.8,.2,1); font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; }
    *{box-sizing:border-box} html,body{min-height:100%;margin:0} body{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--text);background:radial-gradient(700px 460px at 85% -10%,rgba(129,140,248,.14),transparent 62%),radial-gradient(650px 420px at -10% 110%,rgba(94,234,212,.1),transparent 62%),var(--bg)}
    button,input{font:inherit;color:inherit} button{border:0;cursor:pointer} button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .shell{width:min(700px,100%);padding:28px;border:1px solid var(--line);border-radius:22px;background:rgba(13,17,25,.86);box-shadow:0 26px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}.logo{width:46px;height:46px;object-fit:cover;border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.28)}.brand b{display:block;font:700 17px/1.2 "Space Grotesk",sans-serif;letter-spacing:.4px}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
    h1{margin:0;font-size:clamp(22px,4vw,30px)}.lead{margin:9px 0 24px;color:var(--muted);font-size:13px;line-height:1.8}.pick{display:flex;align-items:center;justify-content:center;min-height:145px;padding:20px;border:1px dashed rgba(148,163,184,.3);border-radius:17px;background:rgba(19,26,38,.62);transition:.18s var(--ease)}.pick:hover,.pick.dragover{border-color:var(--accent);background:rgba(94,234,212,.07)}.pick-content{text-align:center}.pick-icon{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 10px;border-radius:15px;color:var(--accent);background:var(--surface-2);font-size:24px}.pick-icon svg{width:24px;height:24px}.pick b{display:block;font-size:14px}.pick p{margin:6px 0 0;color:var(--muted);font-size:11px}.tip{margin:17px 0 0;color:#64748b;font-size:11px;text-align:center}
    .modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:rgba(4,6,10,.76);backdrop-filter:blur(9px);opacity:0;pointer-events:none;transition:opacity .18s ease}.modal.open{opacity:1;pointer-events:auto}.dialog{width:min(760px,100%);max-height:calc(100vh - 36px);overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface-2);box-shadow:0 30px 90px rgba(0,0,0,.66);transform:translateY(8px) scale(.985);transition:transform .18s var(--ease)}.modal.open .dialog{transform:none}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}.file-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}.head-actions{display:flex;align-items:center;gap:7px}.btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-3);font-size:12px}.btn:hover{border-color:rgba(94,234,212,.38)}.btn.primary{color:#07131b;border:0;background:var(--grad)}.close{width:36px;height:36px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:transparent}.close:hover{color:var(--text);background:rgba(255,255,255,.05)}.stage{min-height:240px;max-height:calc(100vh - 130px);display:grid;place-items:center;padding:22px;background:#080b12}.stage audio{width:min(620px,100%)}.stage video{display:block;width:100%;max-height:calc(100vh - 190px);border-radius:10px;background:#000}.stage iframe{width:100%;height:min(70vh,680px);border:0;border-radius:8px;background:#fff}.stage .empty{padding:30px 18px;color:var(--muted);text-align:center}.stage .empty b{display:block;margin-bottom:7px;color:var(--text)}.stage .empty p{margin:0;font-size:12px;line-height:1.7}
    @media(max-width:560px){body{padding:12px}.shell{padding:20px;border-radius:18px}.head{padding:12px}.head .btn{display:none}.stage{padding:12px}.dialog{max-height:calc(100vh - 24px)}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><img class="logo" src="/assets/ace-cloud-logo.jpg" alt="شعار ACE CLOUD" /><div><b>ACE CLOUD</b><small>تجربة مشغل الميديا الخفيف</small></div></div>
    <h1>مشغل بسيط بنفس هوية الموقع</h1>
    <p class="lead">اختَر ملف MP3 أو MP4 أو PDF لاختبار فتحه داخل نافذة منبثقة في نفس الصفحة، بدون فتح تبويب جديد.</p>
    <label class="pick" id="pick" for="fileInput"><span class="pick-content"><span class="pick-icon"><i data-lucide="folder-open" aria-hidden="true"></i></span><b>اختَر ملفًا للتجربة</b><p>MP3 · M4A · WAV · OGG · OPUS · FLAC · AAC · MP4 · PDF</p></span></label>
    <input id="fileInput" type="file" accept="*/*" hidden />
    <p class="tip">يمكنك أيضًا سحب الملف وإفلاته، حتى لو كان بدون امتداد. التشغيل يعتمد على دعم المتصفح للترميز الداخلي.</p>
  </main>
  <div class="modal" id="modal" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="fileName"><header class="head"><b class="file-name" id="fileName">ملف</b><div class="head-actions"><a class="btn" id="download" href="#" download>تنزيل</a><button class="close" id="close" type="button" aria-label="إغلاق"><i data-lucide="x" aria-hidden="true"></i></button></div></header><div class="stage" id="stage"></div></section></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const $ = s => document.querySelector(s);
    const input = $("#fileInput"), pick = $("#pick"), modal = $("#modal"), stage = $("#stage"), name = $("#fileName"), download = $("#download");
    let objectUrl = null;
    function icons(){ if(window.lucide?.createIcons) lucide.createIcons(); }
    function close(){ modal.classList.remove("open"); modal.setAttribute("aria-hidden","true"); stage.replaceChildren(); if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;} }
    async function detectKind(file){
      const ext = /\.([a-z0-9]+)$/i.exec(file.name || "")?.[1]?.toLowerCase() || "";
      const audioExtensions = new Set(["mp3","m4a","wav","ogg","oga","opus","flac","aac","wma","weba","amr","aiff","aif","caf","mid","midi"]);
      if(file.type.startsWith("audio/") || audioExtensions.has(ext)) return "audio";
      if(file.type.startsWith("video/") || ["mp4","webm","mov","m4v"].includes(ext)) return "video";
      if(file.type === "application/pdf" || ext === "pdf") return "pdf";
      const header = new Uint8Array(await file.slice(0, 16).arrayBuffer());
      const text = new TextDecoder("ascii").decode(header);
      const starts = (a, b) => header[a] === b[0] && header[a + 1] === b[1] && header[a + 2] === b[2] && (b.length < 4 || header[a + 3] === b[3]);
      if(text.startsWith("ID3") || starts(0, [0xff, 0xfb]) || starts(0, [0xff, 0xf3]) || starts(0, [0xff, 0xf2]) || text.startsWith("OggS") || text.startsWith("fLaC") || text.includes("WAVE") || text.includes("ftypM4A")) return "audio";
      if(text.startsWith("%PDF")) return "pdf";
      if(text.includes("ftyp") || text.startsWith("\x1a\x45\xdf\xa3")) return "video";
      return null;
    }
    async function open(file){
      if(!file) return;
      const kind = await detectKind(file);
      if(objectUrl) URL.revokeObjectURL(objectUrl); objectUrl=URL.createObjectURL(file);
      name.textContent=file.name; download.href=objectUrl; download.download=file.name;
      stage.replaceChildren();
      if(kind === "audio"){ const player=document.createElement("audio"); player.controls=true; player.autoplay=true; player.src=objectUrl; player.setAttribute("aria-label",`مشغل ${file.name}`); stage.append(player); }
      else if(kind === "video"){ const player=document.createElement("video"); player.controls=true; player.autoplay=true; player.playsInline=true; player.src=objectUrl; player.setAttribute("aria-label",`مشغل ${file.name}`); stage.append(player); }
      else if(kind === "pdf"){ const frame=document.createElement("iframe"); frame.title=`عارض ${file.name}`; frame.src=objectUrl; stage.append(frame); }
      else { stage.innerHTML='<div class="empty"><b>نوع الملف غير مدعوم</b><p>اختر ملفًا صوتيًا أو فيديو MP4 أو مستند PDF.</p></div>'; }
      modal.classList.add("open"); modal.setAttribute("aria-hidden","false"); icons();
    }
    input.addEventListener("change", e => { open(e.target.files?.[0]); e.target.value=""; });
    ["dragenter","dragover"].forEach(type => pick.addEventListener(type,e=>{e.preventDefault();pick.classList.add("dragover");}));
    ["dragleave","drop"].forEach(type => pick.addEventListener(type,e=>{e.preventDefault();pick.classList.remove("dragover");}));
    pick.addEventListener("drop", e => open(e.dataTransfer.files?.[0]));
    $("#close").addEventListener("click",close); modal.addEventListener("click",e=>{if(e.target===modal)close();}); document.addEventListener("keydown",e=>{if(e.key==="Escape" && modal.classList.contains("open"))close();}); icons();
  </script>
</body>
</html>
